name: OpenSooq Toyota Cars Scraper Bot

on:
  workflow_dispatch:
  repository_dispatch:
    types: [cron_trigger]


jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore DB Cache
        uses: actions/cache@v4
        with:
          path: sent_ads.db
          key: opensooq-sent-ads-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            opensooq-sent-ads-db-${{ runner.os }}-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
          SCRAPINGANT_API_KEY_A2: ${{ secrets.SCRAPINGANT_API_KEY_A2 }}
          SCRAPINGANT_API_KEY_A3: ${{ secrets.SCRAPINGANT_API_KEY_A3 }}
          SCRAPINGANT_API_KEY_A4: ${{ secrets.SCRAPINGANT_API_KEY_A4 }}
          SCRAPINGANT_API_KEY_M5: ${{ secrets.SCRAPINGANT_API_KEY_M5 }}
          SCRAPINGANT_API_KEY_M6: ${{ secrets.SCRAPINGANT_API_KEY_M6 }}
          SCRAPINGANT_API_KEY_M7: ${{ secrets.SCRAPINGANT_API_KEY_M7 }}
        run: python main.py

      - name: Save DB Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: sent_ads.db
          key: opensooq-sent-ads-db-${{ runner.os }}-${{ github.run_id }}
